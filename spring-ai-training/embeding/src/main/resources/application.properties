
spring.application.name=helloworld


spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=mypassword

server.port=9999

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

ai.vectorstore.pgvector.initialize-schemae=true
ai.vectorstore.pgvector.table-name=public.vector_store
ai.vectorstore.pgvector.index-type=HNSW
ai.vectorstore.pgvector.dimensions=1536
ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
ai.vectorstore.pgvector.max-document-batch-size=10000 # Optional: Maximum number of documents per batch

spring.ai.ollama.init.pull-model=when-missing
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.base-url=http://localhost:11434
